<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Register - ASSIS</title>
    <style>
      body {
        margin: 0;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: linear-gradient(180deg, #f6f8fb 0%, #ebf2ff 100%);
        color: #172033;
      }
      .wrap {
        max-width: 460px;
        margin: 64px auto;
        padding: 32px;
        background: white;
        border: 1px solid #dde3ee;
        border-radius: 18px;
        box-shadow: 0 24px 48px rgba(16, 40, 78, 0.08);
      }
      h1 {
        margin: 0 0 16px;
        font-size: 30px;
      }
      .field { margin: 14px 0; }
      label { display: block; font-weight: 700; font-size: 13px; margin-bottom: 8px; }
      input {
        width: 100%;
        padding: 12px 14px;
        border-radius: 14px;
        border: 1px solid #dde3ee;
      }
      button {
        width: 100%;
        margin-top: 18px;
        padding: 14px;
        border-radius: 14px;
        border: 0;
        background: #1456d9;
        color: white;
        font-weight: 800;
      }
      .msg { margin: 10px 0; padding: 12px 14px; background: #eff6ff; border-radius: 12px; border: 1px solid #bfdbfe; }
      .err { margin: 10px 0; padding: 12px 14px; background: #fff1f2; border-radius: 12px; border: 1px solid #fecdd3; }
      a { color: #1456d9; font-weight: 700; text-decoration: none; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Create your ASSIS account</h1>
      {% for message in messages %}
        <div class="msg">{{ message }}</div>
      {% endfor %}

      {% if form.non_field_errors %}
        <div class="err">{{ form.non_field_errors }}</div>
      {% endif %}

      <form method="post">
        {% csrf_token %}
        {% for field in form %}
          <div class="field">
            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
            {{ field.errors }}
          </div>
        {% endfor %}
        <button type="submit">Create account</button>
      </form>
      <p style="margin-top:16px; font-size:13px; color:#526071;">Already have an account? <a href="{% url 'login' %}">Sign in</a></p>
    </div>
  </body>
</html>
